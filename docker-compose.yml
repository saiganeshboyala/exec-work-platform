services:
  postgres:
    image: postgres:16-alpine
    container_name: ewp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ewp
      POSTGRES_PASSWORD: ewp_local_password
      POSTGRES_DB: ewp
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ewp -d ewp']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ewp-redis
    restart: unless-stopped
    ports: ['6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: ewp-mailpit
    restart: unless-stopped
    ports: ['1025:1025', '8025:8025']

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ewp-api
    restart: unless-stopped
    env_file: [apps/api/.env]
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: [full]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ewp-web
    restart: unless-stopped
    ports: ['8080:80']
    depends_on: [api]
    profiles: [full]

volumes:
  postgres-data:
  redis-data:
